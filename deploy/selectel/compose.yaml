name: temli

services:
  storage:
    build:
      context: ../..
    command: ["python", "-u", "storage_server.py"]
    env_file:
      - ./shared.env
      - ./storage.env
    environment:
      PORT: "8080"
      TEMLI_DATA_DIR: /data
      TEMLI_STORAGE_INITIALIZE_EMPTY: "true"
      TEMLI_BACKUP_INTERVAL_SECONDS: "21600"
      TEMLI_BACKUP_RETENTION: "60"
      TEMLI_ALLOW_PLAINTEXT_BACKUPS: "false"
    volumes:
      - /var/lib/temli/storage:/data
    networks:
      - storage_internal
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=3).read()"
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  app:
    build:
      context: ../..
    command: ["python", "-u", "bot.py"]
    env_file:
      - ./shared.env
      - ./app.env
    environment:
      PORT: "8080"
      TEMLI_STORAGE_URL: http://storage:8080
      TEMLI_STORAGE_ALLOW_HTTP: "true"
      TEMLI_REMOTE_SCRATCH_DIR: /app/runtime
      TEMLI_REPLICA_DIR: /app/data/temli-storage-replica
      ALLOW_UNAUTHENTICATED: "false"
      TELEGRAM_BOOTSTRAP_RETRIES: "-1"
    volumes:
      - /var/lib/temli/scratch:/app/runtime
      - /var/lib/temli/replica:/app/data/temli-storage-replica
    networks:
      - frontend
      - storage_internal
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=128m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    depends_on:
      storage:
        condition: service_healthy

  caddy:
    image: caddy:2.10.2-alpine
    environment:
      TEMLI_PUBLIC_HOST: ${TEMLI_PUBLIC_HOST:?set TEMLI_PUBLIC_HOST in .env}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - frontend
    restart: unless-stopped
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true

networks:
  frontend:
  storage_internal:
    internal: true

volumes:
  caddy_data:
  caddy_config:
